name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Build all platforms or Windows only
        type: choice
        options:
          - all
          - windows
        default: all
      release_tag:
        description: Version tag for a Windows-only release or draft retry from main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version and prepare draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release-tag: ${{ steps.version.outputs.tag }}
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release tag and manifest versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          RETRY_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          if [[ -n "$RETRY_TAG" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$PLATFORM" != windows || "$GITHUB_REF" != refs/heads/main ]]; then
              echo "A release_tag override is only allowed for a Windows-only release from main."
              exit 1
            fi
          fi
          python3 .github/scripts/check-release.py
      - name: Select build platforms
        id: targets
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          targets = json.loads(Path(".github/release-targets.json").read_text())
          if os.environ["PLATFORM"] == "windows":
              targets = [target for target in targets if target["target"] == "x86_64-pc-windows-msvc"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(targets)}\n")
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: python3 power_d.py selftest
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Create or reuse an unpublished draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          RETRY_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || {
              echo "This version is already published. Create a new version tag."
              exit 1
            }
          else
            extra=()
            if [[ "$PRERELEASE" == true ]]; then extra+=(--prerelease); fi
            if [[ -n "$RETRY_TAG" ]]; then
              # A new manual release creates its tag at this commit on publication.
              extra+=(--target "$GITHUB_SHA")
            else
              extra+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" --draft \
              --title "$RELEASE_TITLE" \
              --notes-file "docs/releases/$RELEASE_TAG.md" "${extra[@]}"
          fi
          if [[ -n "$RETRY_TAG" ]] && gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            # The workflow token updates the draft's tag without starting another push workflow.
            tag_object=$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$RELEASE_TAG" -f message="$RELEASE_TITLE" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$tag_object" -F force=true > /dev/null
          fi
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --prerelease="$PRERELEASE"
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build and packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --locked
      - name: Build installers and attach them to the draft
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: "MTTL-Control_[version]_[platform]_[arch][setup][ext]"

  publish:
    name: Verify assets and publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify installers and add SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets --skip-existing
          python3 .github/scripts/verify-release-assets.py assets "${RELEASE_TAG#v}" "$PLATFORM"
          gh release upload "$RELEASE_TAG" assets/SHA256SUMS.txt --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
