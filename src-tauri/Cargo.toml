[package]
name = "mttl-control"
version = "0.0.1-alpha.1"
description = "Local desktop controller for MTTL-W01 smart power strips"
authors = ["AmrEmad0"]
license = "MIT"
repository = "https://github.com/AmrEmad0/MTTL-W01_APP"
edition = "2024"
rust-version = "1.99"

[lib]
name = "mttl_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
socket2 = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
